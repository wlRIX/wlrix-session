# fcitx5's X11 addon, as wlRIX ships it. start-wlrix puts the directory above `fcitx5/` first in
# XDG_CONFIG_DIRS, so fcitx5 reads this file whenever ~/.config/fcitx5/conf/xcb.conf does not
# exist. Saving the X11 page in fcitx5's configuration tool writes that file, and it then wins
# outright.
#
# The keyboard layout belongs to the compositor: compositor.toml's [keyboard] sets it, and every
# client gets it from there, XWayland included. With this option on (fcitx5's default), fcitx5
# also rewrites XWayland's keymap to its input-method group's layout every time it starts. A
# profile fcitx5 creates on its own has `us` there, because what it reads back from XWayland at
# that moment is XWayland's built-in default. So every X11 client -- Steam, its overlay and the
# games under it -- typed US while native Wayland windows typed the configured layout.
#
# fcitx5 has no way to hand a layout to wlRIX's compositor (it only knows how to on KDE and
# GNOME), so the setting could only ever split the desktop between two layouts, never switch it.
Allow Overriding System XKB Settings=False
