[package]
name = "wlrix-session"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "wlRIX session manager — launches the compositor and core desktop apps, supervises the session."
repository = "https://github.com/wlrix/wlrix-session"
publish = false

[dependencies]
# Only for signal handling: forwarding SIGTERM/SIGINT to the compositor rather than
# dying and orphaning it. Everything else the session needs is in std.
libc = "0.2"
