[package]
name = "wlrix-session"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "wlRIX session manager — launches the compositor and core desktop apps, supervises the session."
repository = "https://github.com/wlrix/wlrix-session"
publish = false

[dependencies]
# Signal handling (forwarding SIGTERM/SIGINT to the compositor rather than dying and
# orphaning it) and resetting an inherited low priority (see `src/priority.rs`).
libc = "0.2"
# The session config file. TOML is wlRIX's config format throughout, so the compositor
# and greeter read the same shape of file.
serde = { version = "1", features = ["derive"] }
toml = "1"
